x-app-base: &app-base
    build:
        context: .
        dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    env_file:
        - .env
    environment:
        APP_ENV: ${APP_ENV:-local}
        APP_DEBUG: ${APP_DEBUG:-true}
        APP_URL: ${APP_URL:-http://localhost:8000}
        MAIL_MAILER: ${MAIL_MAILER:-log}
        MAIL_SCHEME: ${MAIL_SCHEME:-}
        MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
        MAIL_PORT: ${MAIL_PORT:-2525}
        MAIL_USERNAME: ${MAIL_USERNAME:-}
        MAIL_PASSWORD: ${MAIL_PASSWORD:-}
        MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
        MAIL_FROM_NAME: ${MAIL_FROM_NAME:-TickSystem}
        SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
        SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        SENTRY_SAMPLE_RATE: ${SENTRY_SAMPLE_RATE:-1.0}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
        SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
        SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
        SENTRY_ENABLE_LOGS: ${SENTRY_ENABLE_LOGS:-false}
        RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
        CACHE_STORE: redis
        # file driver avoids Redis session cold-start issues in local Docker;
        # switch to redis once cache/queue are confirmed stable.
        SESSION_DRIVER: file
        QUEUE_CONNECTION: redis
        REDIS_CLIENT: predis
        REDIS_HOST: redis
        REDIS_PORT: 6379
        REDIS_PASSWORD: ""
        REDIS_HEALTH_REQUIRED: "false"
    volumes:
        - ./:/app
    networks:
        - infra-network

services:
    app:
        <<: *app-base
        container_name: infra-app
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "php-fpm -t || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s

    queue:
        <<: *app-base
        container_name: infra-queue
        command: php artisan queue:work redis --queue=ai,notifications,media,default --sleep=3 --tries=3 --timeout=180 --max-time=3600
        environment:
            APP_ENV: ${APP_ENV:-local}
            APP_DEBUG: ${APP_DEBUG:-true}
            APP_URL: ${APP_URL:-http://localhost:8000}
            MAIL_MAILER: ${MAIL_MAILER:-log}
            MAIL_SCHEME: ${MAIL_SCHEME:-}
            MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
            MAIL_PORT: ${MAIL_PORT:-2525}
            MAIL_USERNAME: ${MAIL_USERNAME:-}
            MAIL_PASSWORD: ${MAIL_PASSWORD:-}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME:-TickSystem}
            SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
            SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
            SENTRY_RELEASE: ${SENTRY_RELEASE:-}
            SENTRY_SAMPLE_RATE: ${SENTRY_SAMPLE_RATE:-1.0}
            SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
            SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
            SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
            SENTRY_ENABLE_LOGS: ${SENTRY_ENABLE_LOGS:-false}
            RUN_MIGRATIONS: "false"
            CACHE_STORE: redis
            SESSION_DRIVER: file
            QUEUE_CONNECTION: redis
            REDIS_CLIENT: predis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: ""
            REDIS_HEALTH_REQUIRED: "false"
        depends_on:
            app:
                condition: service_healthy
            redis:
                condition: service_healthy

    nginx:
        image: nginx:1.27-alpine
        container_name: infra-nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/app:ro
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app:
                condition: service_healthy
        networks:
            - infra-network
        healthcheck:
            # /up is Laravel's built-in health endpoint — it returns 200 without
            # touching sessions/DB, so it never creates a circular dependency.
            test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/up || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s

    redis:
        image: redis:7-alpine
        container_name: infra-redis
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes"]
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - infra-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    # Grafana Alloy is opt-in: start only when GRAFANA_CLOUD_TOKEN is set and
    # the "monitoring" profile is requested:
    #   GRAFANA_CLOUD_TOKEN=xxx docker compose --profile monitoring up -d
    alloy:
        image: grafana/alloy:latest
        container_name: infra-alloy
        restart: unless-stopped
        profiles:
            - monitoring
        volumes:
            - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
        command: run /etc/alloy/config.alloy
        environment:
            GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
        depends_on:
            nginx:
                condition: service_healthy
        networks:
            - infra-network

volumes:
    redis_data:

networks:
    infra-network:
        driver: bridge
