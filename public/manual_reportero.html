<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual de Usuario — Reportero | Tick System</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--accent:#1565C0;--accent-light:#e8f0fe;--accent-dark:#0d2f6b;--dark:#0a1628;--cyan:#00bcd4;--white:#fff;}
  body{font-family:'DM Sans',sans-serif;background:#0a1628;overflow:hidden;height:100vh;width:100vw;}
  #app{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px;}
  .role-label{font-family:'Syne',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.4);}
  .book-wrap{width:100%;max-width:960px;aspect-ratio:16/9;position:relative;perspective:1800px;}
  .page{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;transform-style:preserve-3d;}
  .flip-next-out{animation:fno .5s cubic-bezier(.4,0,.2,1) forwards;}
  .flip-next-in{animation:fni .5s cubic-bezier(.4,0,.2,1) forwards;}
  .flip-prev-out{animation:fpo .5s cubic-bezier(.4,0,.2,1) forwards;}
  .flip-prev-in{animation:fpi .5s cubic-bezier(.4,0,.2,1) forwards;}
  @keyframes fno{0%{transform:rotateY(0) scale(1);}50%{transform:rotateY(-90deg) scale(.96);}100%{transform:rotateY(-180deg);opacity:0;}}
  @keyframes fni{0%{transform:rotateY(180deg);opacity:0;}50%{transform:rotateY(90deg) scale(.96);}100%{transform:rotateY(0) scale(1);}}
  @keyframes fpo{0%{transform:rotateY(0) scale(1);}50%{transform:rotateY(90deg) scale(.96);}100%{transform:rotateY(180deg);opacity:0;}}
  @keyframes fpi{0%{transform:rotateY(-180deg);opacity:0;}50%{transform:rotateY(-90deg) scale(.96);}100%{transform:rotateY(0) scale(1);}}
  .nav{display:flex;align-items:center;gap:16px;}
  .nav-btn{font-family:'Syne',sans-serif;font-size:12px;letter-spacing:1px;padding:8px 22px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.7);cursor:pointer;transition:all .2s;}
  .nav-btn:hover:not(:disabled){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4);color:#fff;}
  .nav-btn:disabled{opacity:.25;cursor:default;}
  .page-dot-row{display:flex;gap:6px;align-items:center;}
  .page-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s;}
  .page-dot.active{background:#00bcd4;width:18px;border-radius:3px;}
  .slide{width:100%;height:100%;display:flex;flex-direction:column;}
  .cover{background:linear-gradient(145deg,#050e1c 0%,#0d2553 35%,#1565C0 70%,#0e4d8a 100%);position:relative;align-items:center;justify-content:center;text-align:center;overflow:hidden;}
  .cover-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px;}
  .cover-ring1{position:absolute;width:70%;padding-bottom:70%;border-radius:50%;border:1px solid rgba(0,188,212,.15);top:-20%;right:-15%;}
  .cover-ring2{position:absolute;width:45%;padding-bottom:45%;border-radius:50%;border:1px solid rgba(0,188,212,.1);top:0%;right:5%;}
  .cover-dot-grid{position:absolute;bottom:10%;left:5%;display:grid;grid-template-columns:repeat(8,8px);gap:6px;}
  .cover-dot-grid span{width:2px;height:2px;border-radius:50%;background:rgba(0,188,212,.3);display:block;}
  .cover-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px;}
  .cover-eyebrow{font-family:'Syne',sans-serif;font-size:10px;letter-spacing:4px;color:#00bcd4;text-transform:uppercase;margin-bottom:4px;}
  .cover-sys{font-family:'Syne',sans-serif;font-size:12px;letter-spacing:3px;color:rgba(255,255,255,.4);text-transform:uppercase;}
  .cover-icon-wrap{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:28px;margin:8px 0;}
  .cover-title{font-family:'Syne',sans-serif;font-size:clamp(22px,4vw,40px);font-weight:800;color:#fff;line-height:1.15;}
  .cover-title span{color:#00bcd4;}
  .cover-subtitle{font-size:clamp(10px,1.4vw,14px);color:rgba(255,255,255,.55);max-width:520px;line-height:1.6;margin-top:4px;}
  .cover-badge{margin-top:12px;padding:5px 16px;border-radius:20px;border:1px solid rgba(0,188,212,.35);background:rgba(0,188,212,.08);font-family:'Syne',sans-serif;font-size:10px;letter-spacing:2px;color:#00bcd4;text-transform:uppercase;}
  .cover-version{position:absolute;bottom:14px;right:18px;font-size:9px;color:rgba(255,255,255,.2);font-family:'Syne',sans-serif;letter-spacing:1px;}
  .cover-num{position:absolute;bottom:14px;left:18px;font-size:9px;color:rgba(255,255,255,.2);font-family:'Syne',sans-serif;letter-spacing:1px;}
  .content-slide{background:#fff;}
  .s-header{padding:14px 22px 12px;border-bottom:2px solid #1565C0;display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .s-header-badge{padding:3px 10px;border-radius:4px;background:#1565C0;font-family:'Syne',sans-serif;font-size:9px;letter-spacing:1.5px;color:#fff;text-transform:uppercase;white-space:nowrap;}
  .s-header-title{font-family:'Syne',sans-serif;font-size:clamp(12px,1.8vw,17px);font-weight:700;color:#0a1628;flex:1;line-height:1.2;}
  .s-header-pg{font-family:'Syne',sans-serif;font-size:10px;color:#aaa;flex-shrink:0;}
  .s-body{flex:1;display:flex;gap:14px;padding:14px 22px;overflow:hidden;}
  .s-col-main{flex:1.3;display:flex;flex-direction:column;gap:8px;min-width:0;}
  .s-col-side{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;}
  .s-footer{padding:7px 22px;border-top:1px solid #eee;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
  .s-footer-brand{font-family:'Syne',sans-serif;font-size:9px;letter-spacing:2px;color:#ccc;text-transform:uppercase;}
  .s-footer-role{font-size:9px;color:#ccc;}
  .step{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;background:#f7f9ff;border:1px solid #dde8fa;border-radius:8px;}
  .step-n{width:22px;height:22px;border-radius:50%;background:#1565C0;color:#fff;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step-t{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:#0a1628;margin-bottom:2px;}
  .step-d{font-size:10.5px;color:#444;line-height:1.5;}
  .slide-img{width:100%;height:150px;object-fit:contain;border-radius:8px;border:1.5px solid #dde8fa;display:block;}
  .img-ph{flex:1;background:#f3f6fd;border:1.5px dashed #c2d3ee;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center;min-height:80px;}
  .img-ph-ico{font-size:22px;opacity:.35;}
  .img-ph-txt{font-size:9.5px;color:#9ab0cc;line-height:1.4;}
  .info-box{border-radius:8px;padding:10px 12px;}
  .info-lbl{font-family:'Syne',sans-serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;}
  .info-p{font-size:10.5px;line-height:1.55;}
  .toc-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#f7f9ff;border:1px solid #dde8fa;border-radius:7px;}
  .toc-n{width:20px;height:20px;border-radius:50%;background:#1565C0;color:#fff;font-family:'Syne',sans-serif;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .toc-t{flex:1;font-size:11px;color:#222;font-weight:500;}
  .toc-arr{font-size:10px;color:#bbb;}
</style>
</head>
<body>
<div id="app">
  <div class="role-label">📘 Manual de Usuario — Reportero</div>
  <div class="book-wrap">
    <div class="page" id="page"></div>
  </div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">&#8592; Anterior</button>
    <div class="page-dot-row" id="dots"></div>
    <button class="nav-btn" id="nextBtn" onclick="go(1)">Siguiente &#8594;</button>
  </div>
</div>
<script>
const ACCENT='#1565C0', ACCENT_BG='#e8f0fe', ACCENT_TEXT='#1a3a6b';
const PAGES=[
  {type:'cover'},
  {type:'toc', imgSrc:'https://i.imgur.com/Bg8t5SL.png'},
  {type:'content',sec:'Paso 1',title:'Autenticación e inicio de sesión',pg:3,
   imgSrc:'https://i.imgur.com/0PoFzDH.png',
   steps:[
     {n:1,t:'Abrir el sistema',d:'Ingrese la URL del sistema en su navegador (ej: http://localhost o la dirección indicada por TI).'},
     {n:2,t:'Ingresar credenciales',d:'Introduzca su correo corporativo y la contraseña asignada por su administrador de sistema.'},
     {n:3,t:'Clic en Iniciar Sesión',d:'Presione el botón para acceder a su panel personalizado de reportero.'}
   ],
   info:{bg:ACCENT_BG,tc:ACCENT_TEXT,lbl:'Nota de seguridad',txt:'Si olvidó su contraseña, contacte al administrador TI. No comparta sus credenciales con otros empleados bajo ninguna circunstancia.'}},
  {type:'content',sec:'Paso 2',title:'Habilitar notificaciones push en tiempo real',pg:4,
   imgSrc:'https://i.imgur.com/4znVSW4.png',
   steps:[
     {n:1,t:'Permitir en el navegador',d:'Al ingresar por primera vez, el navegador mostrará un banner de permisos. Haga clic en "Permitir" (Allow).'},
     {n:2,t:'Verificar campana activa',d:'En la esquina superior derecha, el ícono de campana debe estar activo. Si aparece bloqueado, revise la configuración del sitio.'},
     {n:3,t:'Registrar su dispositivo',d:'Si el sistema lo solicita, haga clic en el botón de registro para vincular su navegador al servicio de alertas.'}
   ],
   info:{bg:'#e0f2f1',tc:'#00352d',lbl:'¿Por qué es importante?',txt:'Las notificaciones push le informan en tiempo real cuando un técnico atiende su ticket, sin necesidad de refrescar la página manualmente.'}},
  {type:'content',sec:'Paso 3',title:'Registrar un ticket de incidencia',pg:5,
   imgSrc:'https://i.imgur.com/7KqUAaQ.png',
   steps:[
     {n:1,t:'Acceder al formulario',d:'En el panel lateral izquierdo, haga clic en "Crear Incidencia" o en el botón del Dashboard principal.'},
     {n:2,t:'Completar título, descripción, ubicación y categoría',d:'Ingrese título conciso, descripción detallada del fallo, seleccione la oficina (o escanee el QR de la pared) y la categoría de soporte.'},
     {n:3,t:'Adjuntar evidencia fotográfica',d:'Haga clic en "Seleccionar Archivo" y cargue una foto del problema (PNG/JPG, máximo 5MB) como evidencia del fallo.'},
     {n:4,t:'Registrar el ticket',d:'Haga clic en el botón verde "Registrar Ticket". El sistema confirmará el registro y redirigirá a su dashboard.'}
   ],
   info:{bg:ACCENT_BG,tc:ACCENT_TEXT,lbl:'Tip: Código QR',txt:'En dispositivos móviles, escanee el QR pegado en la pared de la oficina. El sistema completará la ubicación automáticamente sin necesidad de escribirla.'}},
  {type:'content',sec:'Paso 4',title:'Monitorear el dashboard personal',pg:6,
   imgSrc:'https://i.imgur.com/MwYt11t.png',
   steps:[
     {n:1,t:'Visualizar estado de mis tickets',d:'El dashboard muestra un gráfico con todos sus reportes activos clasificados por estado: Abierto, En Proceso o Resuelto.'},
     {n:2,t:'Ver detalle de un ticket',d:'Haga clic en el ícono de ojo (Ver Detalle) en cualquier ticket para consultar el historial completo y comentarios del técnico.'},
     {n:3,t:'Recibir actualizaciones automáticas',d:'Recibirá una notificación push cuando el técnico inicie la atención o cuando la incidencia sea marcada como resuelta.'}
   ],
   info:{bg:'#f3e5f5',tc:'#3d0d5e',lbl:'Estados del ticket',txt:'Abierto: creado y en cola. En Proceso: un técnico lo está atendiendo activamente. Resuelto: la incidencia fue solucionada y documentada.'}}
];

let idx=0,busy=false;
function renderPage(i){const p=PAGES[i];if(p.type==='cover')return cover();if(p.type==='toc')return toc(p);return content(p);}
function cover(){const dots=Array(24).fill('<span></span>').join('');return `<div class="slide cover"><div class="cover-grid"></div><div class="cover-ring1"></div><div class="cover-ring2"></div><div class="cover-dot-grid">${dots}</div><div class="cover-inner"><div class="cover-eyebrow">Manual de Usuario</div><div class="cover-sys">⚡ Tick System</div><div class="cover-icon-wrap">📘</div><div class="cover-title">Manual del <span>Reportero</span></div><div class="cover-subtitle">Guía completa para reportar incidencias, adjuntar evidencias y dar seguimiento en tiempo real a través del sistema de gestión.</div><div class="cover-badge">Rol: Reporter</div></div><div class="cover-version">v1.0 — 2026</div><div class="cover-num">1 / ${PAGES.length}</div></div>`;}
function toc(p){const items=['Autenticación e inicio de sesión','Habilitación de notificaciones push','Registrar un ticket de incidencia','Monitorear el dashboard personal'];const rows=items.map((t,i)=>`<div class="toc-row"><div class="toc-n">${i+1}</div><span class="toc-t">${t}</span><span class="toc-arr">›</span></div>`).join('');const sideImg=p.imgSrc?`<img src="${p.imgSrc}" class="slide-img" style="max-height:160px;object-fit:contain;background:#f7f9ff;" />`:`<div class="img-ph" style="min-height:120px;flex:1;"><div style="font-size:36px;opacity:.3;">📘</div><div class="img-ph-txt">Manual completo para el rol<br><strong>Reportero (Reporter)</strong></div></div>`;return `<div class="slide content-slide"><div class="s-header"><div class="s-header-badge">Índice</div><div class="s-header-title">Tabla de contenidos</div><div class="s-header-pg">Pág. 2 / ${PAGES.length}</div></div><div class="s-body"><div class="s-col-main" style="gap:7px;">${rows}</div><div class="s-col-side">${sideImg}<div class="info-box" style="background:#f7f9ff;border:1px solid #dde8fa;"><div class="info-lbl" style="color:#1565C0;">Sobre este manual</div><p class="info-p" style="color:#444;">Documento de uso interno. Contiene los procedimientos operativos oficiales del sistema Tick System para el rol de Reportero.</p></div></div></div><div class="s-footer"><span class="s-footer-brand">Tick System</span><span class="s-footer-role">Rol: Reportero</span></div></div>`;}
function content(p){const steps=p.steps.map(s=>`<div class="step"><div class="step-n">${s.n}</div><div><div class="step-t">${s.t}</div><div class="step-d">${s.d}</div></div></div>`).join('');const sideImg=p.imgSrc?`<img src="${p.imgSrc}" class="slide-img" />`:`<div class="img-ph" style="flex:1;"><div class="img-ph-ico">🖼️</div></div>`;return `<div class="slide content-slide"><div class="s-header"><div class="s-header-badge">${p.sec}</div><div class="s-header-title">${p.title}</div><div class="s-header-pg">Pág. ${p.pg} / ${PAGES.length}</div></div><div class="s-body"><div class="s-col-main">${steps}</div><div class="s-col-side">${sideImg}<div class="info-box" style="background:${p.info.bg};"><div class="info-lbl" style="color:#1565C0;">${p.info.lbl}</div><p class="info-p" style="color:${p.info.tc};">${p.info.txt}</p></div></div></div><div class="s-footer"><span class="s-footer-brand">Tick System</span><span class="s-footer-role">Rol: Reportero</span></div></div>`;}
function buildDots(){const c=document.getElementById('dots');c.innerHTML=PAGES.map((_,i)=>`<div class="page-dot${i===idx?' active':''}" id="d${i}"></div>`).join('');}
function go(dir){if(busy)return;const ni=idx+dir;if(ni<0||ni>=PAGES.length)return;busy=true;const pg=document.getElementById('page');const oc=dir>0?'flip-next-out':'flip-prev-out';const ic=dir>0?'flip-next-in':'flip-prev-in';pg.classList.add(oc);setTimeout(()=>{idx=ni;pg.classList.remove(oc);pg.innerHTML=renderPage(idx);pg.classList.add(ic);buildDots();document.getElementById('prevBtn').disabled=idx===0;document.getElementById('nextBtn').disabled=idx===PAGES.length-1;setTimeout(()=>{pg.classList.remove(ic);busy=false;},510);},510);}
document.getElementById('page').innerHTML=renderPage(0);buildDots();document.getElementById('prevBtn').disabled=true;
</script>
</body>
</html>
