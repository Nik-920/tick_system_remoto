name: 🏗️ Terraform — IaC Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'

env:
  TF_VERSION: '1.15.6'

jobs:

  # ── Job 1: Validación y Plan ─────────────────────────────────────
  terraform-plan:
    name: 🔍 Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔐 Configurar credenciales GitHub
        run: echo "TF_VAR_github_token=${{ secrets.TF_GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: 📦 Terraform Init
        run: terraform -chdir=terraform/github init

      - name: ✅ Terraform Validate
        run: terraform -chdir=terraform/github validate

      - name: 📋 Terraform Plan
        run: terraform -chdir=terraform/github plan
        continue-on-error: false

  # ── Job 2: Apply (solo en push a main) ──────────────────────────
  terraform-apply:
    name: 🚀 Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔐 Configurar credenciales GitHub
        run: echo "TF_VAR_github_token=${{ secrets.TF_GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: 📦 Terraform Init
        run: terraform -chdir=terraform/github init

      - name: 🚀 Terraform Apply
        run: terraform -chdir=terraform/github apply -auto-approve