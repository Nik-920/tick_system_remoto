name: 🎫 CI Pipeline — Sistema de Incidencias

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'fix/**'
      - 'jesus-docker'
      - 'jose-notificaciones'
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '22'

# ═══════════════════════════════════════════════
# JOB 1 — LINT & CODE QUALITY
# Corre en paralelo con frontend-build.
# ═══════════════════════════════════════════════
jobs:
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_pgsql, bcmath, ctype, fileinfo, openssl, tokenizer, xml, curl
          coverage: none
          tools: composer:v2

      - name: 📦 Cache Composer (packages)
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 📦 Instalar dependencias PHP
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader --no-scripts

      - name: ✅ PHP Syntax Check
        run: find app config routes -name "*.php" | xargs php -l

      - name: ✅ Laravel Pint (Code Style)
        run: vendor/bin/pint --test

      - name: Preparar .env para PHPStan
        run: cp .env.testing .env

      - name: ✅ PHPStan — Análisis Estático
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: ✅ PHP CS Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no
        continue-on-error: true

      - name: 🔒 Composer Security Audit (bloqueante)
        run: composer audit

# ═══════════════════════════════════════════════
# JOB 2 — FRONTEND BUILD (paralelo con lint)
# Compila assets y publica artefacto public/build
# para que los jobs de Feature tests lo descarguen
# sin recompilar en cada runner.
# ═══════════════════════════════════════════════
  frontend-build:
    name: 🏗️ Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Instalar dependencias Node
        run: npm ci

      - name: 🏗️ Build frontend
        run: npm run build

      - name: 🔎 Verificar manifest Vite
        run: test -f public/build/manifest.json

      - name: 📤 Publicar artefacto public/build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 1

# ═══════════════════════════════════════════════
# JOB 3 — PARALLEL TESTS BY MODULE
# Requiere lint (gates de calidad) y frontend-build
# (artefacto para Feature tests).
# ═══════════════════════════════════════════════
  test-modules:
    name: 🧪 Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, frontend-build]
    strategy:
      fail-fast: false
      matrix:
        # Simple path-based runners — step uses: vendor/bin/phpunit "tests/${module}"
        module:
          - 'Feature/Ai'
          - 'Feature/Api'
          - 'Feature/Auth'
          - 'Feature/Cache'
          - 'Feature/Console'
          - 'Feature/Dashboard'
          - 'Feature/Events'
          - 'Feature/Http'
          - 'Feature/Idempotency'
          - 'Feature/Jobs'
          - 'Feature/Listeners'
          - 'Feature/Locks'
          - 'Feature/Root'
          - 'Feature/Services'
          - 'Unit/Architecture'
          - 'Unit/Dashboard'
          - 'Unit/Events'
          - 'Unit/Jobs'
          - 'Unit/Listeners'
          - 'Unit/Logging'
          - 'Unit/Models'
          - 'Unit/Policies'
          - 'Unit/Providers'
          - 'Unit/Queries'
          - 'Unit/Services'
          - 'Unit/Support'
          - 'Unit/ViewModels'
        # Feature/Web is split into 4 balanced runners (~38-58 s each locally).
        # Explicit file lists avoid --filter name-collision with other matrix runners
        # that also contain "Ticket", "Reporter", "Maintenance" in their class names.
        include:
          - module: 'Feature/Web — Reporter'
            web_files: >-
              tests/Feature/Web/ReporterDashboardPageTest.php
              tests/Feature/Web/ReporterDashboardRedirectTest.php
              tests/Feature/Web/ReporterGuidePageTest.php
              tests/Feature/Web/ReporterHistoryPageTest.php
              tests/Feature/Web/ReporterTicketCancelPageTest.php
              tests/Feature/Web/ReporterTicketEditPageTest.php
              tests/Feature/Web/ReporterTicketsPageTest.php
              tests/Feature/Web/ReporterTicketTrackingPageTest.php
          - module: 'Feature/Web — Ticket'
            web_files: >-
              tests/Feature/Web/TicketAssignmentControllerTest.php
              tests/Feature/Web/TicketAssignmentsPageTest.php
              tests/Feature/Web/TicketAvailableViewTest.php
              tests/Feature/Web/TicketControllerTest.php
              tests/Feature/Web/TicketDuplicateExplanationPageTest.php
              tests/Feature/Web/TicketHistoryPageTest.php
          - module: 'Feature/Web — Maintenance'
            web_files: >-
              tests/Feature/Web/MaintenanceDashboardReportTest.php
              tests/Feature/Web/MaintenanceDashboardV2PageTest.php
              tests/Feature/Web/MaintenanceTicketsBoardTest.php
              tests/Feature/Web/MaintenanceTicketUpdateTest.php
          - module: 'Feature/Web — Admin+Location+Other'
            web_files: >-
              tests/Feature/Web/AdminDashboardUxTest.php
              tests/Feature/Web/AdminModuleAccessTest.php
              tests/Feature/Web/CategoryDeletionGuardTest.php
              tests/Feature/Web/CategoryDeletionUxTest.php
              tests/Feature/Web/DashboardControllerTest.php
              tests/Feature/Web/FcmTokenControllerTest.php
              tests/Feature/Web/IdempotencyWebTest.php
              tests/Feature/Web/LocationFilterTest.php
              tests/Feature/Web/LocationQrTest.php
              tests/Feature/Web/NotificationControllerTest.php
              tests/Feature/Web/ProfileManagementTest.php
              tests/Feature/Web/PublicPagesRenderTest.php
              tests/Feature/Web/QrScanControllerTest.php
              tests/Feature/Web/SuperAdminSafetyGuardTest.php
              tests/Feature/Web/SuperAdminUserManagementTest.php
              tests/Feature/Web/ThemePreferenceTest.php

    services:
      supabase-db:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_pgsql, bcmath, ctype, fileinfo, openssl, tokenizer, xml, curl
          coverage: none

      - name: 📦 Cache Composer (packages)
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: ⚙️ Preparar .env desde .env.testing
        run: cp .env.testing .env

      - name: 📦 Instalar dependencias PHP
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generar APP_KEY
        run: php artisan key:generate --env=testing

      - name: 🗄️ Ejecutar migraciones
        run: php artisan migrate --force

      - name: 📥 Descargar artefacto frontend (solo Feature tests)
        if: startsWith(matrix.module, 'Feature')
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: 🧪 PHPUnit — ${{ matrix.module }}
        run: |
          module="${{ matrix.module }}"
          web_files="${{ matrix.web_files }}"
          # Sanitise module name for the JUnit filename (replace / and spaces and —)
          junit_name="${module//\//-}"
          junit_name="${junit_name// /-}"
          junit_name="${junit_name//—/-}"
          if [ -n "${web_files}" ]; then
            # Explicit file list — no --filter ambiguity with other matrix runners
            # shellcheck disable=SC2086
            vendor/bin/phpunit \
              $web_files \
              --log-junit "storage/logs/junit-${junit_name}.xml" \
              --testdox
          elif [ "${module}" = "Feature/Root" ]; then
            vendor/bin/phpunit \
              --testsuite Feature-Root \
              --log-junit "storage/logs/junit-Feature-Root.xml" \
              --testdox
          else
            vendor/bin/phpunit \
              "tests/${module}" \
              --log-junit "storage/logs/junit-${junit_name}.xml" \
              --testdox
          fi

      - name: 📊 Publicar reporte de tests — ${{ matrix.module }}
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "storage/logs/junit-*.xml"
          check_name: 'Test Results — ${{ matrix.module }}'

# ═══════════════════════════════════════════════
# JOB 4 — BUILD DOCKER IMAGE
# ═══════════════════════════════════════════════
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-modules
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/devops-setup')

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short

      - name: 🐳 Build & Push imagen
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/nik-920/tick_system_remoto:buildcache
          cache-to: type=registry,ref=ghcr.io/nik-920/tick_system_remoto:buildcache,mode=max
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: 📋 Resumen del build
        run: |
          echo "## 🐳 Docker Image publicada" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
