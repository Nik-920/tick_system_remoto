name: 🤖 Auto-Merge — develop_Local_Nik → main

on:
  # Se dispara cuando el CI Pipeline termina — única fuente de verdad.
  # No usar pull_request: ese evento llega antes de que CI corra
  # y obliga al job a esperar/fallar en polling.
  workflow_run:
    workflows: ["🎫 CI Pipeline — Sistema de Incidencias"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  # ═══════════════════════════════════════════════
  # JOB — AUTO MERGE
  # Solo actúa sobre PRs de develop_Local_Nik → main
  # cuando TODOS los checks requeridos pasan.
  # ═══════════════════════════════════════════════
  auto-merge:
    name: 🤖 Auto-Merge si todos los checks pasan
    runs-on: ubuntu-latest
    # Solo ejecutar cuando el CI concluyó con éxito
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ──────────────────────────────────────────────
      # Buscar el PR abierto de develop_Local_Nik → main
      # ──────────────────────────────────────────────
      - name: 🔍 Buscar PR elegible
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Siempre llegamos por workflow_run — buscar el PR por SHA del commit de CI
          SHA="${{ github.event.workflow_run.head_sha }}"
          PR_DATA=$(gh pr list \
            --base main \
            --state open \
            --json number,headRefName,baseRefName,headRefOid \
            --jq ".[] | select(.headRefOid == \"$SHA\")" \
            2>/dev/null || echo "")

          if [ -z "$PR_DATA" ]; then
            echo "No se encontró PR abierto para SHA=$SHA hacia main"
            echo "eligible=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number')
          HEAD_BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')
          BASE_BRANCH=$(echo "$PR_DATA" | jq -r '.baseRefName')

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "head_branch=$HEAD_BRANCH" >> $GITHUB_OUTPUT
          echo "base_branch=$BASE_BRANCH" >> $GITHUB_OUTPUT

          # Solo actuar sobre PRs de develop_Local_Nik → main
          if [ "$HEAD_BRANCH" = "develop_Local_Nik" ] && [ "$BASE_BRANCH" = "main" ]; then
            echo "eligible=true" >> $GITHUB_OUTPUT
            echo "✅ PR #$PR_NUMBER ($HEAD_BRANCH → $BASE_BRANCH) es elegible para auto-merge"
          else
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "⏭️ PR #$PR_NUMBER ($HEAD_BRANCH → $BASE_BRANCH) no es el PR objetivo — omitiendo"
          fi

      # ──────────────────────────────────────────────
      # Verificar que TODOS los checks requeridos pasen
      # ──────────────────────────────────────────────
      - name: 🔎 Verificar todos los checks del PR
        id: check-status
        if: steps.find-pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.find-pr.outputs.pr_number }}"

          # Esperar hasta 5 minutos a que todos los checks terminen
          MAX_WAIT=300
          ELAPSED=0
          INTERVAL=30

          echo "⏳ Esperando a que todos los checks del PR #$PR_NUMBER terminen..."

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(gh pr checks "$PR_NUMBER" --json name,state,conclusion 2>/dev/null || echo "[]")

            PENDING=$(echo "$STATUS" | jq '[.[] | select(.state == "PENDING" or .state == "IN_PROGRESS" or .state == "QUEUED")] | length')
            FAILED=$(echo "$STATUS" | jq '[.[] | select(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT" or .conclusion == "CANCELLED")] | length')
            PASSED=$(echo "$STATUS" | jq '[.[] | select(.conclusion == "SUCCESS")] | length')
            TOTAL=$(echo "$STATUS" | jq 'length')

            echo "  Checks — Total: $TOTAL | Pasando: $PASSED | Fallando: $FAILED | Pendientes: $PENDING"

            if [ "$FAILED" -gt 0 ]; then
              echo "❌ $FAILED check(s) fallaron — auto-merge cancelado"
              echo "all_passed=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ "$PENDING" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
              echo "✅ Todos los checks completaron exitosamente"
              echo "all_passed=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "  Esperando ${INTERVAL}s más..."
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "⏰ Timeout esperando checks — auto-merge pospuesto"
          echo "all_passed=false" >> $GITHUB_OUTPUT

      # ──────────────────────────────────────────────
      # Ejecutar el merge automático
      # ──────────────────────────────────────────────
      - name: 🚀 Ejecutar Auto-Merge
        if: |
          steps.find-pr.outputs.eligible == 'true' &&
          steps.check-status.outputs.all_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.find-pr.outputs.pr_number }}"

          echo "🤖 Todos los checks pasaron — mergeando PR #$PR_NUMBER..."

          gh pr merge "$PR_NUMBER" \
            --merge \
            --subject "🤖 Auto-merge: develop_Local_Nik → main [CI ✅]" \
            --body "Merge automático ejecutado por GitHub Actions.
          Todos los checks de CI/CD pasaron exitosamente.

          - ✅ Lint & Code Quality
          - ✅ Setup Database
          - ✅ Tests (23 módulos en paralelo)
          - ✅ SonarCloud Analysis"

          echo "✅ Merge completado exitosamente"

      # ──────────────────────────────────────────────
      # Resumen final
      # ──────────────────────────────────────────────
      - name: 📋 Resumen
        if: always()
        run: |
          echo "## 🤖 Auto-Merge Summary" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${{ steps.find-pr.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Rama:** ${{ steps.find-pr.outputs.head_branch }} → ${{ steps.find-pr.outputs.base_branch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Elegible:** ${{ steps.find-pr.outputs.eligible }}" >> $GITHUB_STEP_SUMMARY
          echo "**Checks OK:** ${{ steps.check-status.outputs.all_passed }}" >> $GITHUB_STEP_SUMMARY
          echo "**Fecha:** $(date)" >> $GITHUB_STEP_SUMMARY
