name: 🚀 CD — Deploy

on:
  workflow_run:
    workflows: ["🎫 CI Pipeline — Sistema de Incidencias"]
    types:
      - completed
    branches:
      - main
      - develop

jobs:
  deploy:
    name: 🌐 Deploy a Railway
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    steps:
      - name: 🚂 Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: 🚀 Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway redeploy \
            --service ${{ secrets.RAILWAY_SERVICE_ID }} \
            --yes

      - name: ⏳ Esperar arranque
        run: sleep 20

      - name: 🏥 Health check
        id: healthcheck
        run: |
          ATTEMPTS=12
          SLEEP=10
          for i in $(seq 1 "$ATTEMPTS"); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.APP_URL }}/up" || echo "000")
            echo "Intento $i/$ATTEMPTS — Health check status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Deploy exitoso"
              exit 0
            fi
            sleep "$SLEEP"
          done
          echo "❌ Health check failed tras $ATTEMPTS intentos — iniciando rollback"
          exit 1

      - name: 🔄 Rollback automático
        if: failure() && steps.healthcheck.outcome == 'failure'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${RAILWAY_PROJECT_ID:-}" ] || [ -z "${RAILWAY_ENVIRONMENT_ID:-}" ]; then
            echo "❌ Faltan los secrets RAILWAY_PROJECT_ID y/o RAILWAY_ENVIRONMENT_ID — no se puede hacer rollback automático"
            exit 1
          fi

          echo "⚠️ Buscando el último deployment exitoso anterior..."

          API="https://backboard.railway.com/graphql/v2"
          QUERY='query Deployments($input: DeploymentListInput!, $first: Int) {
            deployments(input: $input, first: $first) {
              edges { node { id status createdAt canRollback } }
            }
          }'

          PAYLOAD=$(jq -n \
            --arg query "$QUERY" \
            --arg projectId "$RAILWAY_PROJECT_ID" \
            --arg serviceId "$RAILWAY_SERVICE_ID" \
            --arg environmentId "$RAILWAY_ENVIRONMENT_ID" \
            '{query: $query, variables: {input: {projectId: $projectId, serviceId: $serviceId, environmentId: $environmentId}, first: 5}}')

          RESPONSE=$(curl -s -X POST "$API" \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
            echo "❌ Error consultando deployments: $(echo "$RESPONSE" | jq -c '.errors')"
            exit 1
          fi

          # El nodo 0 es el deployment recién hecho (el que falló el health check);
          # buscamos el siguiente exitoso con canRollback=true.
          TARGET_ID=$(echo "$RESPONSE" | jq -r '
            [.data.deployments.edges[].node] as $nodes
            | ($nodes[1:][] | select(.canRollback == true and .status == "SUCCESS") | .id)' \
            | head -n 1)

          if [ -z "$TARGET_ID" ] || [ "$TARGET_ID" = "null" ]; then
            echo "❌ No se encontró un deployment anterior al que hacer rollback — intervención manual requerida"
            exit 1
          fi

          echo "⏪ Ejecutando rollback al deployment $TARGET_ID"

          ROLLBACK_PAYLOAD=$(jq -n --arg id "$TARGET_ID" \
            '{query: "mutation DeploymentRollback($id: String!) { deploymentRollback(id: $id) { id status } }", variables: {id: $id}}')

          ROLLBACK_RESPONSE=$(curl -s -X POST "$API" \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$ROLLBACK_PAYLOAD")

          if echo "$ROLLBACK_RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
            echo "❌ Error ejecutando rollback: $(echo "$ROLLBACK_RESPONSE" | jq -c '.errors')"
            exit 1
          fi

          echo "✅ Rollback solicitado: $(echo "$ROLLBACK_RESPONSE" | jq -c '.data.deploymentRollback')"

      - name: ⏳ Esperar rollback
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: sleep 30

      - name: 🏥 Verificar rollback
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          ATTEMPTS=6
          SLEEP=10
          for i in $(seq 1 "$ATTEMPTS"); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.APP_URL }}/up" || echo "000")
            echo "Intento $i/$ATTEMPTS — Verificar rollback status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Rollback exitoso — versión anterior restaurada"
              exit 0
            fi
            sleep "$SLEEP"
          done
          echo "❌ Rollback también falló — intervención manual requerida"
          exit 1

      - name: 🗑️ Prune community thumbnails
        if: success()
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run \
            --service ${{ secrets.RAILWAY_SERVICE_ID }} \
            -- \
            php artisan community:thumbnails:prune --older-than=30 --limit=1000 --prune-hidden

      - name: 📋 Resumen
        if: always()
        run: |
          echo "## 🚀 CD Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.event.workflow_run.head_branch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.event.workflow_run.head_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Hora:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ vars.APP_URL }}" >> $GITHUB_STEP_SUMMARY